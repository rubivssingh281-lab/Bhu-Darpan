services:
  - type: web
    name: bhu-darpan-backend
    runtime: python
    rootDir: Backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    buildCommand: "pip install --no-cache-dir --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RENDER
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173,http://localhost:8010"
      - key: AUTO_REFRESH_HOURS
        value: "0"
